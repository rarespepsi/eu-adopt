{% load static %}
{% if user_onboarding_payload %}
<link rel="stylesheet" href="{% static 'css/user-onboarding.css' %}?v=2" type="text/css" media="screen" />
<div
	id="eu-user-onboard"
	class="eu-user-onboard is-active"
	data-dismiss-url="{% url 'user_onboarding_mark_seen' %}"
	aria-live="polite"
>
	<div class="eu-user-onboard__backdrop" aria-hidden="true"></div>
	<div class="eu-user-onboard__banner" role="dialog" aria-labelledby="eu-user-onboard-title">
		<span class="eu-user-onboard__title" id="eu-user-onboard-title"></span>
		<span class="eu-user-onboard__text"></span>
		<span class="eu-user-onboard__hint"></span>
		<div class="eu-user-onboard__actions">
			<button type="button" class="eu-user-onboard__btn eu-user-onboard__btn--ghost" data-onboard-skip>{% if eu_site_active %}{{ eu_ui.onboard_skip }}{% else %}Sari peste{% endif %}</button>
			<button type="button" class="eu-user-onboard__btn" data-onboard-tour>{% if eu_site_active %}{{ eu_ui.onboard_tour }}{% else %}Continuă turul{% endif %}</button>
		</div>
	</div>
	<div class="eu-user-onboard__tour" hidden role="dialog" aria-label="{% if eu_site_active %}{{ eu_ui.onboard_tour_aria }}{% else %}Tur pagină{% endif %}">
		<p class="eu-user-onboard__tour-step"></p>
		<p class="eu-user-onboard__tour-text"></p>
		<div class="eu-user-onboard__actions">
			<button type="button" class="eu-user-onboard__btn eu-user-onboard__btn--ghost" data-onboard-skip>{% if eu_site_active %}{{ eu_ui.onboard_close }}{% else %}Închide{% endif %}</button>
			<button type="button" class="eu-user-onboard__btn" data-onboard-next hidden>{% if eu_site_active %}{{ eu_ui.onboard_next }}{% else %}Următorul{% endif %}</button>
			<button type="button" class="eu-user-onboard__btn" data-onboard-done hidden>{% if eu_site_active %}{{ eu_ui.onboard_done }}{% else %}Am înțeles{% endif %}</button>
		</div>
	</div>
</div>
{{ user_onboarding_payload|json_script:"eu-user-onboard-data" }}
<script src="{% static 'js/user-onboarding.js' %}?v=2"></script>
{% endif %}
