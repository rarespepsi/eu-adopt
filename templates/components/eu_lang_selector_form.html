<form class="a0-eu-lang-form{% if extra_class %} {{ extra_class }}{% endif %}" action="{% url 'set_language' %}" method="post">
	{% csrf_token %}
	<input type="hidden" name="next" value="{{ request.get_full_path }}" />
	<img class="a0-eu-lang-flag" src="{{ eu_site_flag_url }}" width="20" height="15" alt="" decoding="async" />
	<select id="{{ select_id|default:'a0_eu_lang_select' }}" class="a0-eu-lang-select" name="language" onchange="this.form.submit()" aria-label="{{ eu_nav_text.lang_label|default:'Language' }}">
		{% for code, label in eu_site_languages %}
		<option value="{{ code }}"{% if code == eu_site_lang %} selected{% endif %}>{{ label }}</option>
		{% endfor %}
	</select>
</form>
