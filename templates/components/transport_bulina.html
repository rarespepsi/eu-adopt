{% load static %}
{% if eu_site_active %}
{# .com / EU: bulina → Asociația Suflet și Caracter (nu /custi/ — doar caseta centrală) #}
<a href="{{ transport_bulina_partner_url }}" class="t2-extra-circle" title="{{ eu_ui.transport_bulina_partner_title }}" target="_blank" rel="noopener noreferrer">
	<img src="{% static 'images/transport/servicii/central.jpeg' %}" alt="" class="t2-extra-circle-img" />
	<svg class="t2-extra-circle-svg" viewBox="0 0 100 100" aria-hidden="true">
		<defs>
			<path id="t2-extra-circle-path" d="M50 10a40 40 0 1 1 0 80a40 40 0 1 1 0-80" />
		</defs>
		<text class="t2-extra-circle-text">
			<textPath href="#t2-extra-circle-path" startOffset="50%" text-anchor="middle">
				{{ eu_ui.transport_bulina_ring }}
			</textPath>
		</text>
	</svg>
</a>
{% else %}
<a href="{% url 'custi' %}?sursa=transport_bulina" class="t2-extra-circle" title="Harta cuștilor autocarului — locuri de cumpărat">
	<img src="{% static 'images/transport/servicii/central.jpeg' %}" alt="" class="t2-extra-circle-img" />
	<svg class="t2-extra-circle-svg" viewBox="0 0 100 100" aria-hidden="true">
		<defs>
			<path id="t2-extra-circle-path" d="M50 10a40 40 0 1 1 0 80a40 40 0 1 1 0-80" />
		</defs>
		<text class="t2-extra-circle-text">
			<textPath href="#t2-extra-circle-path" startOffset="50%" text-anchor="middle">
				* Ajută o cauză * Suflet * Caracter * We Come To You *
			</textPath>
		</text>
	</svg>
</a>
{% endif %}
