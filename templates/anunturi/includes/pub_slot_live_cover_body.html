{% if creative.price or creative.discount %}
<span class="pub-live-mini-badges">{% if creative.price %}<span class="pub-live-mini-badge pub-live-mini-badge--price">{{ creative.price }}</span>{% endif %}{% if creative.discount %}<span class="pub-live-mini-badge pub-live-mini-badge--discount">{{ creative.discount }}</span>{% endif %}</span>
{% endif %}
<span class="pub-live-cover{% if layout %} pub-live-cover--{{ layout }}{% endif %}">
	{% if creative.video %}
	<video src="{{ creative.video }}" autoplay muted loop playsinline controls preload="metadata"></video>
	{% elif creative.img %}
	<img src="{{ creative.img }}" alt="{{ creative.alt|default:'Publicitate' }}"{% if layout == "strip" %} loading="eager"{% else %} loading="lazy"{% endif %} decoding="async" />
	{% endif %}
	{% if creative.is_default_cover %}<span class="pub-live-cover__tag">Publi.</span>{% endif %}
</span>
