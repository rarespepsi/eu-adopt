{% if show_loc or show_sf %}
<div class="eu-pet-card-meta eu-pet-card-meta--row">
	{% if show_loc %}<span class="eu-pet-card-meta__loc">{{ loc }}</span>{% endif %}
	{% if show_loc and show_sf %}<span class="eu-pet-card-meta__sep" aria-hidden="true"> · </span>{% endif %}
	{% if show_sf %}
		{% if sex_letter %}<span class="eu-pet-card-meta__sex">{{ sex_letter }}</span>{% endif %}
		{% if sex_letter and age_text %}<span class="eu-pet-card-meta__sep" aria-hidden="true"> · </span>{% endif %}
		{% if age_text %}<span class="eu-pet-card-meta__age">{{ age_text }}</span>{% endif %}
	{% endif %}
</div>
{% endif %}
