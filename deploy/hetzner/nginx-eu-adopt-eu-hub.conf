# Hub EU — principal: euadopt.com / .eu / .org (+ .de / .fr / .es)
server {
    listen 80;
    server_name euadopt.com www.euadopt.com euadopt.eu www.euadopt.eu euadopt.org www.euadopt.org
                euadopt.de www.euadopt.de euadopt.fr www.euadopt.fr euadopt.es www.euadopt.es;

    client_max_body_size 12M;
    include snippets/euadopt-security-headers.conf;

    location /static/ {
        alias /opt/eu-adopt/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /opt/eu-adopt/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# Redirect cu cratimă: preferă certbot + return 301 pe HTTPS, ex.:
#   eu-adopt.com → https://euadopt.com$request_uri
# Fallback: Django EuSiteMiddleware (301) dacă requestul ajunge la app.