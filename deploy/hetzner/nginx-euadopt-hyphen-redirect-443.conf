# Include dupa certbot pe HTTPS — redirect 301 cu cratima -> fara cratima.
# Nu include eu-adopt.ro (ramane nemodificat).

server {
    listen 443 ssl;
    server_name eu-adopt.com;
    include snippets/euadopt-security-headers.conf;
    ssl_certificate /etc/letsencrypt/live/eu-adopt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eu-adopt.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://euadopt.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.eu-adopt.com;
    include snippets/euadopt-security-headers.conf;
    ssl_certificate /etc/letsencrypt/live/eu-adopt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eu-adopt.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.euadopt.com$request_uri;
}

