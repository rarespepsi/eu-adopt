# Toate domeniile active (RO + euadopt.*) — același upstream Django
# Include în /etc/nginx/sites-enabled/ după eu-adopt.ro sau înlocuiește server_name pe blocul existent.

server {
    listen 80;
    server_name
        eu-adopt.ro www.eu-adopt.ro
        euadopt.com www.euadopt.com
        euadopt.de www.euadopt.de
        euadopt.fr www.euadopt.fr
        euadopt.es www.euadopt.es;

    client_max_body_size 12M;
    include snippets/euadopt-security-headers.conf;

    location /static/ {
        alias /opt/eu-adopt/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /opt/eu-adopt/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# Redirect 301: cratimă + alias hub (.eu/.org) → euadopt.com
server {
    listen 80;
    server_name eu-adopt.com;
    return 301 https://euadopt.com$request_uri;
}
server {
    listen 80;
    server_name www.eu-adopt.com;
    return 301 https://www.euadopt.com$request_uri;
}
server {
    listen 80;
    server_name eu-adopt.eu euadopt.eu;
    return 301 https://euadopt.com$request_uri;
}
server {
    listen 80;
    server_name www.eu-adopt.eu www.euadopt.eu;
    return 301 https://www.euadopt.com$request_uri;
}
server {
    listen 80;
    server_name euadopt.org;
    return 301 https://euadopt.com$request_uri;
}
server {
    listen 80;
    server_name www.euadopt.org;
    return 301 https://www.euadopt.com$request_uri;
}
