# Strategie B: .ro + .com + .de/.fr/.es active; .eu/.org/cratimă → 301 în Django.
# Proxy toate hosturile cumpărate către app.

server {
    listen 80;
    server_name
        eu-adopt.ro www.eu-adopt.ro
        euadopt.com www.euadopt.com
        euadopt.de www.euadopt.de
        euadopt.fr www.euadopt.fr
        euadopt.es www.euadopt.es
        euadopt.eu www.euadopt.eu
        euadopt.org www.euadopt.org
        eu-adopt.com www.eu-adopt.com
        eu-adopt.eu www.eu-adopt.eu;

    client_max_body_size 100M;
    include snippets/euadopt-security-headers.conf;

    location /static/ {
        alias /opt/eu-adopt/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /opt/eu-adopt/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
